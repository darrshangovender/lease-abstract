[project]
name = "lease-abstract"
version = "0.1.1"
description = "Residential lease abstraction and compliance checking for South African rentals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["lease", "rental-housing-act", "south-africa", "compliance", "llm", "extraction", "popia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pydantic :: 2",
    "Topic :: Text Processing",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# PDF input is opt-in: pdfplumber pulls in pdfminer and is not needed for the
# text pipeline, the tests or the eval.
pdf = ["pdfplumber>=0.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    # eval/run.py reads demo/expected_findings.yml
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/lease-abstract"
Repository = "https://github.com/darrshangovender/lease-abstract"
Issues = "https://github.com/darrshangovender/lease-abstract/issues"

[project.scripts]
lease-abstract = "lease_abstract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lease_abstract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so `ruff check .` means the same thing on every ruff version.
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the long lines are statute explanations and regex literals; splitting them
# makes the legal text and the patterns harder to check against their sources.
ignore = ["E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["lease_abstract"]
